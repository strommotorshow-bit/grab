<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grab Fleet">
<title>Grab Fleet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Ctext x='32' y='42' font-size='28' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3EGF%3C/text%3E%3C/svg%3E">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f7f9;font:15px system-ui,sans-serif;color:#334}
  .box{text-align:center;padding:24px}
  .logo{width:56px;height:56px;border-radius:14px;background:#0f766e;color:#fff;font:700 24px Arial;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  a{display:inline-block;margin-top:14px;padding:12px 22px;border-radius:10px;background:#0f766e;color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <div class="logo">GF</div>
  <div id="msg">กำลังเปิด Grab Fleet…</div>
  <a id="go" href="#">เปิด Grab Fleet</a>
</div>
<script>
  // grab.stromthailand.com            → แอปพนักงาน Grab Fleet
  // grab.stromthailand.com/sign/<รหัส> → หน้าลงนามสัญญาของลูกค้า
  // เปิดแบบเต็มหน้า (ไม่ใช้ iframe) เพื่อให้ใช้ได้แม้เบราว์เซอร์ล็อกอิน Google หลายบัญชี
  var APP = 'https://script.google.com/macros/s/AKfycbzmSCEzmWVFiQFFnC2srZ9Che7S4lu6Z1-LTekJ2E1svfk5Oz0gyzvToOM-0nMMs3x01A/exec';
  var path = location.pathname.replace(/^\/+|\/+$/g, '');
  var m = path.match(/^sign\/([A-Za-z0-9-]{12,64})$/i);
  var url = APP;
  if (m) {
    url = APP + '?sign=' + encodeURIComponent(m[1]);
    document.title = 'ลงนามสัญญาออนไลน์ | STROM';
    document.getElementById('msg').textContent = 'กำลังเปิดหน้าลงนามสัญญา…';
    document.getElementById('go').textContent = 'เปิดหน้าลงนามสัญญา';
  }
  document.getElementById('go').href = url;
  location.replace(url);
</script>
</body>
</html>

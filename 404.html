<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Grab Fleet</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grab Fleet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230f766e%27/%3E%3Ctext x=%2732%27 y=%2742%27 font-size=%2728%27 font-family=%27Arial%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3EGF%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--pri:#0f766e;--pri-2:#115e59;--pri-bg:#e6f4f2;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;--bg:#f6f7f9;--warn:#b45309;--warn-bg:#fef3c7;--bad:#b91c1c;--bad-bg:#fee2e2;--ok:#15803d;--ok-bg:#dcfce7}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Sarabun',system-ui,sans-serif;font-size:16px;color:var(--ink);background:var(--bg)}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px 96px}
  header.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff}
  header.top .in{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
  header.top .title{flex:1;font-weight:700;font-size:17px;line-height:1.2}
  header.top .sub{font-size:13px;opacity:.85;font-weight:400}
  #hLoc{max-width:42vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff!important;color:var(--pri)!important;font-weight:600}
  header.top button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
  h2{font-size:20px;margin:18px 0 6px}
  .hint{color:var(--mute);font-size:15px;margin:0 0 14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:600px){.grid.g3{grid-template-columns:repeat(3,1fr)}}
  .tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 12px;text-align:center;cursor:pointer;font-weight:600;font-size:16px;min-height:86px;display:flex;flex-direction:column;justify-content:center;gap:4px}
  .tile .ic{font-size:24px}
  .tile:active{background:var(--pri-bg)}
  .stat{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .stat:last-child{border-bottom:0}
  .num{font-weight:700;font-size:20px;min-width:36px;text-align:right}
  .num.warn{color:var(--warn)}.num.bad{color:var(--bad)}
  .pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:#eef2f7;color:#374151}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.pri{background:var(--pri-bg);color:var(--pri-2)}
  .row{display:flex;gap:10px;align-items:center}
  .item{display:flex;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px;cursor:pointer}
  .item.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset;background:var(--pri-bg)}
  .item .l1{font-weight:600}.item .l2{color:var(--mute);font-size:14px}
  label{display:block;font-weight:600;font-size:15px;margin:12px 0 4px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:10px;font:inherit;background:#fff}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);border-color:var(--pri)}
  input[readonly]{background:#f3f4f6}
  .err{color:var(--bad);font-size:14px;margin-top:4px}
  a.btn{text-decoration:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;min-height:48px}
  .btn.sec{background:#fff;color:var(--ink);border:1px solid #d1d5db}
  .btn.bad{background:var(--bad)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.block{width:100%}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:15}
  .nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:14;padding-bottom:env(safe-area-inset-bottom)}
  .nav .in{max-width:760px;margin:0 auto;display:flex}
  .nav a{flex:1;text-align:center;padding:7px 2px 6px;color:var(--mute);text-decoration:none;font-size:12px;position:relative;cursor:pointer}
  .nav a .i{display:block;font-size:20px;line-height:1.2}
  .nav a.on{color:var(--pri);font-weight:700}
  .nav a .b{position:absolute;top:2px;left:50%;margin-left:6px;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px;font-weight:700}
  body.hasbar .nav,body.nonav .nav{display:none}
  .tile.big{min-height:110px;font-size:17px}.tile.big .ic{font-size:30px}
  .tile.off{opacity:.45;cursor:default}
  .bar .in{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;gap:10px}
  .bar .btn{flex:1}
  .steps{display:flex;gap:4px;margin:14px 0 4px}
  .steps div{flex:1;height:6px;border-radius:3px;background:var(--line)}
  .steps div.on{background:var(--pri)}
  .stepname{font-size:14px;color:var(--pri-2);font-weight:700}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
  .chip{border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
  .chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
  .alert{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px}
  .alert.warn{background:var(--warn-bg);color:#78350f}.alert.bad{background:var(--bad-bg);color:#7f1d1d}.alert.ok{background:var(--ok-bg);color:#14532d}.alert.info{background:var(--pri-bg);color:var(--pri-2)}
  .kv{display:grid;grid-template-columns:140px 1fr;gap:6px 10px;font-size:15px}
  .kv div:nth-child(odd){color:var(--mute)}
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .ph{border:2px dashed #d1d5db;border-radius:10px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--mute);cursor:pointer;overflow:hidden;position:relative;background:#fff}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ph.done{border-style:solid;border-color:var(--ok)}
  .ph.up{border-style:solid;border-color:#f59e0b}.ph.up::after{content:'กำลังอัปโหลด…';position:absolute;top:0;left:0;right:0;background:rgba(245,158,11,.9);color:#fff;font-size:11px;padding:2px}
  .ph.err{border-style:solid;border-color:var(--bad)}.ph.err::after{content:'อัปโหลดไม่สำเร็จ แตะเพื่อถ่ายใหม่';position:absolute;top:0;left:0;right:0;background:rgba(180,35,24,.92);color:#fff;font-size:11px;padding:2px}
  #hTask{background:#fff!important;color:var(--pri)!important;font-weight:700;white-space:nowrap}#hTask.err{color:#b42318!important}
  .spin.sm{width:22px;height:22px;border-width:3px;display:inline-block;vertical-align:middle}
  .ph .cap{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px}
  .sig{border:1px solid #d1d5db;border-radius:10px;background:#fff;touch-action:none;width:100%;height:180px;display:block}
  .notice{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fafafa;font-size:14px;line-height:1.55}
  .check{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-weight:400}
  .check input{width:22px;height:22px;flex:0 0 22px;margin-top:2px}
  .checks{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 10px}
  .checks label{display:flex;gap:8px;align-items:center;font-weight:400;margin:6px 0}
  .checks input{width:20px;height:20px}
  .loading{position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-weight:600}
  .spin{width:42px;height:42px;border:4px solid var(--pri-bg);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;max-width:90%;font-size:15px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  .modal .box{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 24px}
  .muted{color:var(--mute)}.small{font-size:14px}.right{text-align:right}.mt{margin-top:12px}
  table.t{width:100%;border-collapse:collapse;font-size:14px}table.t td,table.t th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
  .hide{display:none}
  .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  @media(min-width:600px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .kpi .v{font-size:24px;font-weight:700;line-height:1.1}.kpi .k{color:var(--mute);font-size:13px}
  .hbar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
  .hbar .lb{width:120px;flex:0 0 120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hbar .tr{flex:1;background:#eef2f7;border-radius:6px;height:16px;overflow:hidden}
  .hbar .fl{height:100%;background:var(--pri);border-radius:6px}
  .hbar .nv{width:64px;text-align:right;font-variant-numeric:tabular-nums}
  .vbars{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:6px;border-bottom:1px solid var(--line)}
  .vbars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;min-width:0}
  .vbars .seg{border-radius:3px 3px 0 0}
  .vlbl{display:flex;gap:6px;font-size:11px;color:var(--mute)}.vlbl div{flex:1;text-align:center;min-width:0}
  .legend{display:flex;gap:14px;font-size:13px;margin:8px 0;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
  .tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.tbl th:first-child,.tbl td:first-child{text-align:left}
  .scroll{overflow-x:auto}
</style>
</head>
<body>
<header class="top"><div class="in">
  <button id="hBack" class="hide" onclick="goBack()">‹ กลับ</button>
  <div class="title"><span id="hTitle">Grab Fleet</span><div class="sub" id="hSub"></div></div>
  <button id="hTask" class="hide" onclick="taskList()"></button>
  <button id="hLoc" class="hide" onclick="locPicker()"></button>
  <button id="hMenu" class="hide" onclick="navTo('more')">เมนู</button>
</div></header>
<div class="wrap" id="app"></div>
<div id="barHost"></div>
<div id="navHost"></div>
<div id="overlay"></div>

<script>window.addEventListener('error',function(e){var a=document.getElementById('app');if(a&&!a.innerHTML)a.innerHTML='<div style="margin:16px;padding:12px;border-radius:10px;background:#fee2e2;color:#b91c1c">เปิดแอปไม่สำเร็จ: '+String(e.message).replace(/</g,'&lt;')+' (บรรทัด '+e.lineno+')<br>ลองรีเฟรชหน้า ถ้ายังไม่ได้ แจ้งผู้ดูแลระบบ</div>';});</script>
<script>
/* ===================== สถานะของแอป ===================== */
// localStorage อาจใช้ไม่ได้ในบางเบราว์เซอร์ (บล็อกคุกกี้บุคคลที่สาม) จึงห่อด้วย try/catch
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const S = { token: store.get('gf_token') || '', user: null, boot: null, loc: '', history: [], wiz: null };
const SCREENS = {};
const PHOTO_ANGLES = [['front','ด้านหน้า'],['back','ด้านหลัง'],['left','ด้านซ้าย'],['right','ด้านขวา'],['mileage','เลขไมล์'],['vin','เลข VIN']];
const ACCESSORIES = ['ที่ชาร์จ','OBC','Type2 / Type2 Adapter','แบตเตอรี่ SWAP','แฮนด์บาร์','ที่จับมือถือ','ที่วางแก้ว','กระจกข้าง','ท้ายรถ-กันตก','ท้ายรถ-แร็คสไลด์','Crashbar','Spotlight','IC CARD'];
const CANCEL_REASONS = ['ผู้เช่าขอยกเลิก/คืนรถก่อนกำหนด','ค้างชำระเกิน 7 วัน','ผิดเงื่อนไขสัญญา','ทำสัญญาผิด (ข้อมูลไม่ถูกต้อง)','อื่นๆ'];
const V_PILL = {'ว่าง':'ok','จองแล้ว':'warn','ให้เช่า':'pri','ระหว่างโยก':'warn','รอเคลม':'bad','ส่งซ่อม':'warn','ติดตามยึด':'bad','ยึดคืนแล้ว':'','ปลดระวาง':''};
const K_PILL = {'รอประกันอนุมัติ':'warn','ประกันอนุมัติ':'pri','กำลังซ่อม':'warn','ซ่อมเสร็จ':'ok','ปิดเคส':''};
const C_PILL = {'Active':'ok','รอเซ็น':'warn','หมดสัญญา':'bad','ต้องตรวจสอบ':'bad','ยกเลิก':'','คืนรถแล้ว':'','ต่อสัญญาแล้ว':'pri','ยึดรถ':'bad'};

/* ===================== เครื่องมือ ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n || 0).toLocaleString('th-TH');
const pill = (t, map) => `<span class="pill ${map[t] || ''}">${esc(t)}</span>`;
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const th = s => { if (!s) return ''; const d = new Date(s.length === 10 ? s + 'T00:00:00' : s); return d.getDate() + '/' + (d.getMonth() + 1) + '/' + (d.getFullYear() + 543); };
function may(k) { return !!(S.boot && S.boot.perms && S.boot.perms.indexOf(k) >= 0); }
const can = (...roles) => S.user && roles.indexOf(S.user.role) >= 0;
const locName = c => { const l = (S.boot ? S.boot.locations : []).find(x => x.code === c); return l ? l.name : c; };

// เปิดจาก grab.stromthailand.com → เรียกระบบหลังบ้านด้วย fetch โดยไม่ส่งคุกกี้ Google (กันปัญหาล็อกอินหลายบัญชี)
// เปิดจากลิงก์ script.google.com → ใช้ google.script.run เหมือนเดิม
const API_URL = 'https:\/\/script.google.com/macros/s/AKfycbzmSCEzmWVFiQFFnC2srZ9Che7S4lu6Z1-LTekJ2E1svfk5Oz0gyzvToOM-0nMMs3x01A/exec';
const IN_GAS = typeof google !== 'undefined' && !!(google.script && google.script.run);
const cleanErr = m => String(m || '').replace(/^(Error|Exception):\s*/, '');
async function callServer(fn, args) {
  if (IN_GAS) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(new Error(cleanErr((e && e.message) || String(e)))))[fn](...args));
  let r;
  for (let i = 0; ; i++) {
    try { r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn, args }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow' }); break; }
    catch (e) { if (i >= 1 || !/^(get|list|search|find|verify|returnPreview)/.test(fn)) throw new Error('เชื่อมต่อระบบไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่'); await new Promise(z => setTimeout(z, 1200)); }
  }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('ระบบตอบกลับผิดปกติ (' + r.status + ') ลองใหม่อีกครั้ง'); }
  if (!j.ok) throw new Error(cleanErr(j.error));
  return j.data;
}
function api(fn, ...args) {
  return callServer(fn, [S.token, ...args]).catch(e => {
    if (/SESSION_EXPIRED/.test(e.message)) { toast('หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่'); doLogout(true); }
    throw e;
  });
}
function apiRaw(fn, ...args) { return callServer(fn, args); }

async function busy(msg, p) {
  $('overlay').innerHTML = `<div class="loading"><div class="spin"></div><div>${esc(msg)}</div></div>`;
  try { return await p; } finally { $('overlay').innerHTML = ''; }
}
function toast(msg, ms) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms || 3200); }
function fail(e) { toast('ทำรายการไม่สำเร็จ: ' + e.message, 5000); }

function setHeader(title, sub, back) {
  $('hTitle').textContent = title; $('hSub').textContent = sub || '';
  $('hBack').textContent = S.history.length ? '‹ กลับ' : '‹ หน้าหลัก'; $('hBack').classList.toggle('hide', !back); $('hMenu').classList.toggle('hide', !S.user);
}
function setBar(html) { $('barHost').innerHTML = html ? `<div class="bar"><div class="in">${html}</div></div>` : ''; document.body.classList.toggle('hasbar', !!html); }
function show(html) { $('app').innerHTML = html; window.scrollTo(0, 0); }
function go(screen, arg, push = true) { if (push && S.cur) S.history.push(S.cur); S.cur = { screen, arg }; renderNav(); renderLocBtn(); const r = SCREENS[screen](arg); markUploads(); if (r && r.then) r.then(markUploads, () => {}); }

/* ===================== งานเบื้องหลัง =====================
   งานที่ต้องสร้าง PDF (เซ็นสัญญา รับคืนรถ ยึดรถ ฯลฯ) ใช้เวลา 15–30 วินาที
   ระบบส่งคำสั่งแล้วปล่อยให้ผู้ใช้ทำรายการอื่นต่อได้ทันที เมื่อเสร็จจะแจ้งเตือน และดูผลได้ที่ปุ่มงานบนแถบด้านบน */
S.tasks = [];
function bgRun(label, thunk, onDone, sec) {
  const t = { id: 't' + Date.now() + Math.floor(Math.random() * 1000), label: label, thunk: thunk, onDone: onDone, sec: sec || 30, state: 'run', start: Date.now() };
  S.tasks.unshift(t); S.tasks = S.tasks.slice(0, 15);
  S.bgId = t.id; S.wiz = null; go('bgwait', t.id, false);
  bgExec(t);
}
function bgExec(t) {
  t.state = 'run'; t.start = Date.now(); t.err = ''; renderTray();
  t.thunk().then(r => {
    t.state = 'ok'; t.r = r; t.end = Date.now(); S.today = null; renderTray();
    if (S.cur && S.cur.screen === 'bgwait' && S.cur.arg === t.id) t.onDone(r); else toast('✓ ' + t.label + ' เสร็จแล้ว (ดูที่ปุ่มงานด้านบน)', 5000);
  }).catch(e => {
    t.state = 'err'; t.err = e.message || String(e); renderTray();
    if (S.cur && S.cur.screen === 'bgwait' && S.cur.arg === t.id) SCREENS.bgwait(t.id); else toast('✗ ' + t.label + ' ไม่สำเร็จ — แตะปุ่มงานด้านบนเพื่อลองใหม่', 7000);
  });
}
SCREENS.bgwait = id => {
  const t = S.tasks.find(x => x.id === id); if (!t) return home();
  if (t.state === 'ok') return t.onDone(t.r);

function pickPhoto(facing) {
  return new Promise(resolve => {
    const inp = document.createElement('input'); inp.type = 'file';
    if (facing === 'file') inp.accept = 'image/' + '*,application/pdf'; else { inp.accept = 'image/' + '*'; inp.capture = facing || 'environment'; }
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return resolve(null);
      const r = new FileReader();
      if (/pdf/.test(f.type)) { if (f.size > 10 * 1024 * 1024) { toast('ไฟล์ PDF ใหญ่เกิน 10MB'); return resolve(null); } r.onload = () => resolve(r.result); return r.readAsDataURL(f); }
      r.onload = () => { const img = new Image(); img.onload = () => {
        const max = 1280, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); resolve(c.toDataURL('image/jpeg', 0.75)); }; img.src = r.result; };
      r.readAsDataURL(f);
    };
    inp.click();
  });
}

/* ===================== ช่องลายเซ็น ===================== */
function sigPad(id) {
  const c = $(id); const r = c.getBoundingClientRect(); const dpr = window.devicePixelRatio || 1;
  c.width = r.width * dpr; c.height = r.height * dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr); x.lineWidth = 2.4; x.lineCap = 'round'; x.strokeStyle = '#111';
  let down = false, last = null; c.dataset.empty = '1';
  const p = e => { const b = c.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
  c.onpointerdown = e => { down = true; last = p(e); c.setPointerCapture(e.pointerId); };
  c.onpointermove = e => { if (!down) return; const q = p(e); x.beginPath(); x.moveTo(last.x, last.y); x.lineTo(q.x, q.y); x.stroke(); last = q; c.dataset.empty = '0'; };
  c.onpointerup = c.onpointercancel = () => { down = false; };
  return { clear() { x.clearRect(0, 0, c.width, c.height); c.dataset.empty = '1'; }, empty() { return c.dataset.empty === '1'; }, data() { return c.toDataURL('image/png'); } };
}

/* เปิดไฟล์ Drive ผ่านระบบ (ผู้ใช้ไม่ต้องมีสิทธิ์ใน Google Drive) */
function openFile(url) {
  openBlob(async prog => {
    const first = await api('getFile', url);
    if (first.parts <= 1) return first;
    const chunks = [first.b64];
    for (let i = 1; i < first.parts; i++) { prog('กำลังโหลด ' + Math.round(i / first.parts * 100) + '% (ไฟล์ ' + (first.size / 1048576).toFixed(1) + ' MB)'); chunks.push((await api('getFile', url, i)).b64); }
    return Object.assign(first, { chunks: chunks });
  }, url);
}

/* ===================== ตัวช่วยวิซาร์ด ===================== */
function stepHead(names, i) {
  return `<div class="steps">${names.map((n, k) => `<div class="${k <= i ? 'on' : ''}"></div>`).join('')}</div>
  <div class="stepname">ขั้นตอน ${i + 1} จาก ${names.length}: ${names[i]}</div>`;
}
function pkgFor(model) {
  const all = S.boot.packages.filter(p => p.model === model);
  const here = all.filter(p => p.loc === S.loc);
  const list = here.length ? here : all;
  const byDur = {}; list.forEach(p => { if (!byDur[p.duration]) byDur[p.duration] = p; });
  const durs = ['1 เดือน', '3 เดือน', '6 เดือน', '1 ปี'].filter(d => byDur[d] || d !== '6 เดือน');
  return durs.map(d => byDur[d] || { duration: d, months: d === '1 ปี' ? 12 : parseInt(d, 10), daily: 0, deposit: S.boot.cfg.deposit });
}
function endDate(startYmd, months) { const d = new Date(startYmd + 'T00:00:00'); d.setMonth(d.getMonth() + months); d.setDate(d.getDate() - 1); return ymd(d); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000) + 1; }

  ${w.type === 'renew' ? '' : `<label>เงินมัดจำ (บาท)</label><input id="pdep" type="number" value="${w.deposit != null ? w.deposit : S.boot.cfg.deposit}" oninput="S.wiz.deposit=+this.value">`}

function toggleAcc(a, on) { const s = new Set(S.wiz.acc); on ? s.add(a) : s.delete(a); S.wiz.acc = [...s]; }
async function snap(kind, key, mode) {
  const d = await pickPhoto(mode); if (!d || !S.wiz) return;
  const w = S.wiz, cid = w.contractId, k = cid + '|' + kind, scr = S.cur.screen;
  const store = kind.startsWith('return_') ? w.returnPhotos : kind.startsWith('retdmg_') ? w.dmgFiles : kind.startsWith('seize_') ? w.seizePhotos : kind.startsWith('damage_') ? w.damagePhotos : w.handoverPhotos;
  store[key] = d;
  const u = S.upl[k] = { state: 'run' };
  const redraw = () => { if (S.wiz === w && S.cur.screen === scr) { SCREENS[scr](); markUploads(); } };
  redraw();
  u.p = api('uploadPhoto', cid, kind, d).then(() => { u.state = 'ok'; redraw(); })
    .catch(e => { u.state = 'err'; if (store[key] === d) delete store[key]; redraw(); toast('อัปโหลดรูปไม่สำเร็จ: ' + e.message, 5000); throw e; });
}
function dmgSlot(prefix, k, store) {
  const d = store[k], isPdf = d && /^data:application\/pdf/.test(d);
  return `<div class="ph ${d ? 'done' : ''}" onclick="snap('${prefix}${k}','${k}','file')">${d ? (isPdf ? '<span style="font-size:30px">&#x1F4C4;</span>' : `<img src="${d}">`) : '&#x2795;'}<span class="cap">${d ? (isPdf ? 'PDF' : 'รูป ' + k) : 'แนบไฟล์'}</span></div>`;
}
async function finishHandover() {
  const w = S.wiz;

  if (Object.keys(w.handoverPhotos).length < 6) return toast('ถ่ายรูปรถให้ครบ 6 รูปก่อน');

  if (w.acc.includes('IC CARD') && !w.icDep) return toast('เลือกวิธีชำระมัดจำบัตร IC CARD');

const RENEW_STEPS = ['เลือกสัญญาเดิม', 'แพ็กเกจใหม่', 'ผู้เช่ารับทราบ PDPA และเซ็น'];
function startRenew(id) {
  const begin = async cid => {
    try {
      const d = await busy('กำลังโหลด…', api('getContract', cid));
      if (!['Active', 'หมดสัญญา'].includes(d.contract.status)) return toast('ต่อสัญญาได้เฉพาะสัญญาที่ Active หรือหมดสัญญาแต่รถยังอยู่กับผู้เช่า');
      const st = new Date(d.contract.end_date + 'T00:00:00'); st.setDate(st.getDate() + 1);
      S.wiz = { type: 'renew', step: 1, parent: d.contract, vin: d.contract.vin, vehicle: { model: d.contract.model }, customer: d.customer, start: ymd(st), deposit: d.contract.deposit };
      go('renewWiz');
    } catch (e) { fail(e); }
  };
  if (id) return begin(id);
  pickContract('ต่อสัญญา', 'เลือกสัญญาที่จะต่ออายุ (เฉพาะสัญญา Active) สัญญาที่ใกล้หมดอยู่บนสุด', c => c.status === 'Active', begin);
}

  <div class="card"><div class="kv"><div>ผู้เช่า</div><div>${esc(w.customer.full_name)}</div><div>สัญญาเดิม</div><div>${esc(w.parent.contract_id)} · หมด ${th(w.parent.end_date)}</div><div>รถ</div><div>${esc(w.vin)}</div></div></div>
  ${pkgBlock(w.parent.model, w.start, true)}`);

async function createRenew() {
  const w = S.wiz;
  if (!(w.daily > 0)) return toast('กรอกค่าเช่าต่อวัน');
  try {
    const r = await busy('กำลังสร้างสัญญา…', api('createContract', { location_code: S.loc, vin: w.vin, parent_contract_id: w.parent.contract_id, duration: w.pkg.duration, start_date: w.start, end_date: w.end, daily_rate: w.daily, promotion: w.promo || '', iccard_no: w.iccard || '' }));
    w.contractId = r.contract_id; w.locked = true; w.step = 2; SCREENS.renewWiz();
  } catch (e) { fail(e); }
}

function retLate() { const w = S.wiz; return w.waive ? 0 : Number(w.pv.late_fee || 0); }
function retSum() { const w = S.wiz, net = Number(w.d.contract.deposit || 0) - w.damage - w.overdue - w.other - (w.cancelFee || 0) - retLate(); $('retsum').className = 'alert mt ' + (net >= 0 ? 'ok' : 'warn'); $('retsum').innerHTML = (net >= 0 ? 'คืนเงินให้ผู้เช่า' : 'ผู้เช่าต้องชำระเพิ่ม') + ` <b>${money(Math.abs(net))} บาท</b>`; }
async function doReturn() {
  const w = S.wiz;
  if (padC.empty() || padS.empty()) return toast('ต้องมีลายเซ็นทั้งผู้เช่าและพนักงาน');
  if (!(await waitUploads())) return;
  const cid = w.contractId, payload = { mileage: w.mileage || '', checklist: w.acc, damages: w.damages || '', damage_cost: w.damage, overdue_amount: w.overdue, other_cost: w.other, cancel_fee: w.cancelFee || 0, waive_late: !!w.waive, waive_reason: w.waiveReason || '', note: w.note || '', needRepair: !!w.needRepair, sigCustomer: padC.data(), sigStaff: padS.data(), userAgent: navigator.userAgent };
  bgRun('รับคืนรถ ' + cid, () => api('returnVehicle', cid, payload), r => {
    doneScreen('รับคืนรถเรียบร้อย', (r.net >= 0 ? 'คืนเงินให้ผู้เช่า ' : 'ผู้เช่าต้องชำระเพิ่ม ') + money(Math.abs(r.net)) + ' บาท' + (r.late_fee ? ' (รวมค่าปรับคืนช้า ' + r.late_days + ' วัน ' + money(r.late_fee) + ' บาท)' : ''), r.pdf_url, cid);
    if (r.debt_url) { S.lastDebtUrl = r.debt_url; $('app').querySelector('.card').insertAdjacentHTML('beforeend', `<button class="btn sec block mt" onclick="openFile(S.lastDebtUrl)">เปิดหนังสือรับสภาพหนี้</button>`); }
  }, 25);
}

function dashLoc(code) {
  const s = S.dash;
  if (code === 'ALL') s.locs = [];
  else s.locs = s.locs.includes(code) ? s.locs.filter(x => x !== code) : s.locs.concat(code);
  dashApply();
}
function dashApply() {
  S.dash.model = $('dModel').value; S.dash.ownership = $('dOwn').value; S.dash.from = $('dFrom').value; S.dash.to = $('dTo').value;
  go('dashboard', Object.assign({}, S.dash), false);
}

async function doSeize() {
  const w = S.wiz;
  if (Object.keys(w.seizePhotos).length < 4) return toast('ถ่ายรูปรถอย่างน้อย 4 รูป');
  if (padC.empty() || padS.empty()) return toast('ต้องมีลายเซ็นทั้งสองช่อง');
  if (!w.present && !String(w.witness || '').trim()) return toast('ระบุชื่อพยาน');
  if (!(await waitUploads())) return;
  const sig = padC.data(), z = w.z, present = w.present, cid = w.contractId;
  const payload = { location: w.location || '', mileage: w.mileage || '', checklist: w.acc, condition: w.condition || '', far: !!w.far, tow_cost: Number(w.tow || 0), rider_present: present,
    sigCustomer: present ? sig : '', sigWitness: present ? '' : sig, witness_name: w.witness || '', sigStaff: padS.data(), userAgent: navigator.userAgent };
  bgRun((z.kind === 'ทิ้งรถ' ? 'รับรถจอดทิ้ง ' : 'ยึดรถ ') + cid, () => api('seizeVehicle', z.seizure_id, payload), r => {
    doneScreen(z.kind === 'ทิ้งรถ' ? 'บันทึกรับรถที่จอดทิ้งแล้ว' : 'บันทึกยึดรถแล้ว', 'ตั้งหนี้ ' + money(r.total) + ' บาท (ดูที่เมนู "หนี้ที่ต้องเก็บ") · ขั้นต่อไป: ส่งประเมินความเสียหาย แล้วกด "แจ้งค่าเสียหาย"', r.pdf_url, cid);
    if (r.debt_url) { S.lastDebtUrl = r.debt_url; $('app').querySelector('.card').insertAdjacentHTML('beforeend', `<button class="btn sec block mt" onclick="openFile(S.lastDebtUrl)">${present ? 'เปิดหนังสือรับสภาพหนี้' : 'เปิดหนังสือแจ้งให้ชำระหนี้ (ส่งให้ผู้เช่า)'}</button>`); }
  }, 30);
}

  return `<div class="alert info">ส่งลิงก์ให้ลูกค้าแล้ว รอลูกค้าเซ็น (ใช้ได้ถึง ${esc(th(l.expires_at))}) · ${l.opened_at ? 'ลูกค้าเปิดดูแล้ว' : 'ลูกค้ายังไม่เปิดลิงก์'}</div>`;
}
async function sendSignLink(id) {

    const r = await busy('กำลังสร้างสัญญาฉบับร่างและลิงก์… (ประมาณ 10–20 วินาที)', api('createSignLink', id));

    modal(`<h2 style="margin-top:0">ส่งลิงก์ให้ลูกค้าเซ็น</h2><p class="hint">ส่งข้อความนี้ให้ลูกค้าทาง LINE หรือ SMS ลิงก์ใช้ได้ถึง ${esc(r.expires)} ใช้ได้กับสัญญานี้เท่านั้น ห้ามส่งให้คนอื่น</p>
    <textarea id="slMsg" rows="8" readonly>${esc(r.message)}</textarea>
    <div class="row mt" style="flex-wrap:wrap"><button class="btn" onclick="copyText('slMsg')">คัดลอกข้อความ</button>
    <a class="btn sec" href="https://line.me/R/share?text=${enc}" target="_blank">ส่งทาง LINE</a>
    <a class="btn sec" href="sms:${esc(r.phone)}?&body=${enc}" target="_blank">ส่ง SMS</a></div>
    <p class="small muted mt">ขั้นตอนของลูกค้า: กรอกเลขบัตร 4 หลักท้าย &rarr; อ่านสัญญา &rarr; ถ่ายรูปตัวเองคู่บัตรประชาชน &rarr; เซ็นชื่อ<br>เมื่อลูกค้าเซ็นแล้ว สัญญาจะขึ้นที่หน้าแรก "ลูกค้าเซ็นออนไลน์แล้ว รอผู้ให้เช่าเซ็น"</p>
    <button class="btn sec block mt" onclick="closeModal();S.wiz=null;S.history=[];go('contract','${esc(id)}',false)">เสร็จ</button>`);

}
function copyText(id) {
  const el = $(id); el.removeAttribute('readonly'); el.select(); let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { }
  el.setAttribute('readonly', '');
  if (ok) return toast('คัดลอกแล้ว');
  if (navigator.clipboard) navigator.clipboard.writeText(el.value).then(() => toast('คัดลอกแล้ว'), () => toast('คัดลอกไม่ได้ กดค้างที่ข้อความเพื่อคัดลอกเอง'));
  else toast('กดค้างที่ข้อความเพื่อคัดลอกเอง');
}
function countersign(id) {
  modal(`<h2 style="margin-top:0">เซ็นในนามผู้ให้เช่า</h2><p class="hint">ลูกค้าเซ็นออนไลน์แล้ว เซ็นในกรอบเพื่อออกสัญญาฉบับสมบูรณ์ ลูกค้าเปิดลิงก์เดิมเพื่อดาวน์โหลดสัญญาได้</p>

async function doCountersign(id) {

  bgRun('ออกสัญญา ' + id, () => api('signContract', id, payload), r => doneScreen('ออกสัญญาฉบับสมบูรณ์แล้ว', 'สัญญา ' + id + ' เริ่มใช้งานแล้ว', r.pdf_url, id), 25);
}

/* ===================== หน้าเซ็นสำหรับลูกค้า (เปิดจากลิงก์ ไม่ต้องล็อกอิน) ===================== */
const RS_STEPS = ['ยืนยันตัวตน', 'อ่านสัญญา', 'ถ่ายรูปคู่บัตร', 'เซ็นชื่อ'];
async function startRemoteSign(tok) {
  S.rsTok = tok; S.rs = { step: 0 };
  setHeader('ลงนามสัญญาออนไลน์', 'STROM · Grab', false); setBar('');
  show('<p class="muted mt">กำลังโหลด…</p>');
  try {
    const d = await apiRaw('getSignRequest', tok);
    S.rs.d = d; S.boot = { cfg: { notice: d.notice, lessor: d.lessor } }; rsRender();
  } catch (e) { show(`<div class="alert bad mt">${esc(e.message)}</div>`); }
}
function rsOpenDoc() { openBlob(() => apiRaw('getSignDoc', S.rsTok, S.rs.id4)); }
function rsRender() {
  const r = S.rs, d = r.d, x = r.info;
  if (d.locked) { setBar(''); return show(`<div class="alert bad mt">กรอกเลขบัตรผิดเกินกำหนด ลิงก์นี้ถูกล็อก กรุณาติดต่อเจ้าหน้าที่เพื่อขอลิงก์ใหม่</div>`); }
  if (r.done || (d.status === 'ลูกค้าเซ็นแล้ว')) {
    setBar('');
    return show(`<div class="card mt" style="text-align:center"><div style="font-size:48px">&#x2705;</div><h2>ได้รับลายเซ็นของท่านแล้ว</h2><p>ขอบคุณค่ะ ขั้นต่อไปบริษัทจะลงนามฝั่งผู้ให้เช่า เมื่อเสร็จแล้วท่านเปิดลิงก์เดิมนี้อีกครั้งเพื่อดาวน์โหลดสัญญาฉบับสมบูรณ์ได้</p></div>`);
  }
  // ขั้นที่ 0: ยืนยันเลขบัตรก่อนเห็นข้อมูลใด ๆ
  if (!x) {
    const done = d.status === 'เสร็จสมบูรณ์';
    show((done ? '' : stepHead(RS_STEPS, 0)) + `<h2>${done ? 'ดาวน์โหลดสัญญาฉบับสมบูรณ์' : 'ยืนยันตัวตน'}</h2>
    <p class="hint">สัญญาเลขที่ <b>${esc(d.contract_id)}</b> จาก ${esc(d.lessor)}<br>เพื่อความปลอดภัยของข้อมูล กรุณากรอกเลขบัตรประชาชน 4 หลักท้ายของผู้เช่า</p>
    <div class="card"><label>เลขบัตรประชาชน 4 หลักท้าย</label><input id="id4" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(r.id4 || '')}" oninput="S.rs.id4=this.value" onkeydown="if(event.key==='Enter')rsVerify()">
    <p class="small muted mt">กรอกผิดได้ไม่เกิน ${d.tries_left} ครั้ง</p></div>`);
    setBar(`<button class="btn" onclick="rsVerify()">${done ? 'ยืนยันและดาวน์โหลด' : 'ถัดไป'}</button>`);
    return;
  }
  if (d.status === 'เสร็จสมบูรณ์') {
    setBar('');
    return show(`<div class="card mt" style="text-align:center"><div style="font-size:48px">&#x2705;</div><h2>สัญญาสมบูรณ์แล้ว</h2><p>สัญญาเลขที่ ${esc(x.contract_id)} ลงนามครบทั้งสองฝ่ายแล้ว กรุณาดาวน์โหลดเก็บไว้</p>
    <button class="btn block mt" onclick="rsOpenDoc()">ดาวน์โหลดสัญญา PDF</button></div>`);
  }
  if (r.step === 1) {
    show(stepHead(RS_STEPS, 1) + `<h2>${x.kind === 'ต่อ' ? 'สัญญาต่ออายุการเช่า' : 'สัญญาเช่ารถ'}</h2>
    <p class="hint">สวัสดีคุณ${esc(x.name)} กรุณาตรวจข้อมูล กดอ่านสัญญาฉบับเต็ม แล้วอ่านประกาศความเป็นส่วนตัวให้จบ</p>
    <div class="card"><div class="kv"><div>เลขที่สัญญา</div><div>${esc(x.contract_id)}</div><div>ผู้เช่า</div><div>${esc(x.name)}</div><div>เลขบัตร</div><div>${esc(x.id_masked)}</div>
    <div>รถ</div><div>${esc(x.model)} ${x.plate ? '· ' + esc(x.plate) : ''}<br><span class="small muted">${esc(x.vin)}</span></div>
    <div>ระยะเวลา</div><div>${esc(x.duration)}<br>${esc(x.start)} – ${esc(x.end)}</div>
    <div>ค่าเช่า</div><div>${money(x.daily_rate)} บาท/วัน${x.promotion ? ' · ' + esc(x.promotion) : ''}</div><div>มัดจำ</div><div>${money(x.deposit)} บาท</div></div></div>
    <button class="btn sec block" onclick="rsOpenDoc()">&#x1F4C4; อ่านสัญญาฉบับเต็ม (PDF)</button>
    <div class="notice mt" onscroll="if(this.scrollTop+this.clientHeight>=this.scrollHeight-8)$('ack').disabled=false">${noticeHtml()}</div>
    <label class="check"><input type="checkbox" id="ack" ${r.ack ? 'checked' : 'disabled'}> ข้าพเจ้าได้อ่านและรับทราบประกาศความเป็นส่วนตัวแล้ว (เลื่อนอ่านให้จบก่อน)</label>
    <label class="check"><input type="checkbox" id="rd" ${r.read ? 'checked' : ''}> ข้าพเจ้าได้อ่านสัญญาและเอกสารแนบท้ายครบถ้วนแล้ว เข้าใจและยอมรับเงื่อนไขทุกข้อ</label>
    <label class="check"><input type="checkbox" id="mkt" ${r.mkt ? 'checked' : ''}> ยินยอมให้ส่งข่าวสาร โปรโมชั่น และบริการใหม่ทาง LINE (ไม่บังคับ)</label>
    <label class="check"><input type="checkbox" id="grp" ${r.grp ? 'checked' : ''}> ยินยอมให้บริษัทในกลุ่มติดต่อเสนอบริการชาร์จ/สลับแบตเตอรี่ (ไม่บังคับ)</label>`);
    setBar(`<button class="btn" onclick="rsNext1()">ถัดไป</button>`);
    const nt = document.querySelector('.notice'); if (nt && nt.scrollHeight <= nt.clientHeight + 8) $('ack').disabled = false;
  } else if (r.step === 2) {
    show(stepHead(RS_STEPS, 2) + `<h2>ถ่ายรูปคู่บัตรประชาชน</h2><p class="hint">ถ่ายรูปตัวท่านถือบัตรประชาชนตัวจริง ให้เห็นใบหน้าและบัตรชัดเจน</p>
    <div class="photos"><div class="ph ${r.selfie ? 'done' : ''}" onclick="rsSelfie()" style="grid-column:span 3">${r.selfie ? `<img src="${r.selfie}">` : '&#x1F933;'}<span class="cap">${r.selfie ? 'แตะเพื่อถ่ายใหม่' : 'แตะเพื่อถ่ายรูป'}</span></div></div>`);
    setBar(`<button class="btn sec" onclick="S.rs.step=1;rsRender()">ย้อนกลับ</button><button class="btn" onclick="rsNext2()">ถัดไป</button>`);
  } else {
    show(stepHead(RS_STEPS, 3) + `<h2>เซ็นชื่อ</h2><p class="hint">เซ็นชื่อในกรอบด้านล่างด้วยนิ้ว ลายเซ็นนี้จะใช้ในสัญญาและเอกสารแนบท้ายทุกฉบับ</p>
    <canvas id="sigC" class="sig"></canvas><button class="btn sec mt" onclick="padC.clear()">ล้างลายเซ็น</button>
    <p class="small muted mt">เมื่อกด "ยืนยันลงนาม" ถือว่าท่านลงลายมือชื่ออิเล็กทรอนิกส์ในสัญญาเลขที่ ${esc(x.contract_id)} ตามพระราชบัญญัติว่าด้วยธุรกรรมทางอิเล็กทรอนิกส์ พ.ศ. 2544</p>`);
    window.padC = sigPad('sigC');
    setBar(`<button class="btn sec" onclick="S.rs.step=2;rsRender()">ย้อนกลับ</button><button class="btn" onclick="rsSubmit()">ยืนยันลงนาม</button>`);
  }
  window.scrollTo(0, 0);
}
async function rsVerify() {
  const r = S.rs;
  if (!/^\d{4}$/.test(String(r.id4 || ''))) return toast('กรอกเลขบัตรประชาชน 4 หลักท้าย');
  try { r.info = await busy('กำลังตรวจสอบ…', apiRaw('verifyId4', S.rsTok, r.id4)); r.step = 1; rsRender(); }
  catch (e) {
    fail(e);
    const m = String(e.message).match(/เหลือ (\d+) ครั้ง/); if (m) { r.d.tries_left = Number(m[1]); if (r.d.tries_left === 0) r.d.locked = true; rsRender(); }
    if (/ล็อก/.test(e.message)) { r.d.locked = true; rsRender(); }
  }
}
function rsNext1() {
  const r = S.rs; r.ack = $('ack').checked; r.read = $('rd').checked; r.mkt = $('mkt').checked; r.grp = $('grp').checked;
  if (!r.ack) return toast('กรุณาเลื่อนอ่านประกาศความเป็นส่วนตัวให้จบ แล้วติ๊กรับทราบ');
  if (!r.read) return toast('กรุณาอ่านสัญญาแล้วติ๊กยอมรับเงื่อนไข');
  r.step = 2; rsRender();
}
async function rsSelfie() { const d = await pickPhoto('user'); if (d) { S.rs.selfie = d; rsRender(); } }
function rsNext2() { if (!S.rs.selfie) return toast('กรุณาถ่ายรูปตัวท่านคู่บัตรประชาชน'); S.rs.step = 3; rsRender(); }
async function rsSubmit() {
  const r = S.rs;
  if (padC.empty()) return toast('กรุณาเซ็นชื่อในกรอบ');
  try {
    await busy('กำลังบันทึกลายเซ็น…', apiRaw('submitRemoteSign', S.rsTok, { id4: r.id4, selfie: r.selfie, signature: padC.data(), pdpaAck: r.ack, marketing: r.mkt, group: r.grp, userAgent: navigator.userAgent }));
    r.done = true; rsRender();
  } catch (e) { fail(e); }
}

/* ===================== เริ่มต้น ===================== */
window.addEventListener('error', e => { const a = $('app'); if (a && !a.innerHTML) a.innerHTML = '<div class="alert bad mt">เกิดข้อผิดพลาด: ' + esc(e.message) + '</div>'; });
function startApp() { S.token ? boot() : screenLogin(); }
function startWith(t) { try { t ? startRemoteSign(t) : startApp(); } catch (e) { $('app').innerHTML = '<div class="alert bad mt">เกิดข้อผิดพลาด: ' + esc(e.message) + '</div>'; } }
if (IN_GAS) {
  // ลิงก์เซ็นสัญญาของลูกค้า: ...exec?sign=xxxx
  try { google.script.url.getLocation(loc => startWith(loc && loc.parameter && loc.parameter.sign)); } catch (e) { startWith(null); }
} else {
  // grab.stromthailand.com/sign/<รหัส> หรือ ?sign=<รหัส>
  const p = location.pathname.replace(/^\/+|\/+$/g, ''), m = p.match(/^sign\/([A-Za-z0-9_-]{8,80})$/);
  const q = new URLSearchParams(location.search).get('sign');
  if (p && !m && !q) history.replaceState(null, '', '/');
  startWith(m ? m[1] : q);
}
</script>

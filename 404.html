<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grab Fleet">
<title>Grab Fleet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Ctext x='32' y='42' font-size='28' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3EGF%3C/text%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#f6f7f9;font:15px system-ui,sans-serif;color:#334}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:none}
  .box{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .logo{width:56px;height:56px;border-radius:14px;background:#0f766e;color:#fff;font:700 24px Arial;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  a.btn{display:inline-block;margin-top:14px;padding:12px 22px;border-radius:10px;background:#0f766e;color:#fff;text-decoration:none;font-weight:600}
  #fb{position:fixed;left:0;right:0;top:0;text-align:center;font-size:13px;padding:6px;background:#fffbeb;display:none;z-index:9}
  #fb a{color:#0f766e;font-weight:600}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="logo">GF</div>
  <div id="msg">กำลังเปิด Grab Fleet…</div>
  <a class="btn" id="go" href="#" target="_top">เปิด Grab Fleet</a>
</div>
<iframe id="app" title="Grab Fleet" allow="camera; clipboard-read; clipboard-write; fullscreen"></iframe>
<div id="fb">ถ้าหน้าไม่ขึ้น <a id="fbl" target="_top">แตะที่นี่เพื่อเปิดแบบเต็มหน้า</a></div>
<script>
  // grab.stromthailand.com            → แอปพนักงาน Grab Fleet
  // grab.stromthailand.com/sign/<รหัส> → หน้าลงนามสัญญาของลูกค้า
  // มือถือ/แท็บเล็ต: ฝังในหน้านี้ (ลิงก์สั้นอยู่ตลอด)
  // คอมพิวเตอร์: เปิดแบบเต็มหน้า (กันปัญหาเบราว์เซอร์ที่ล็อกอิน Google หลายบัญชี)
  var APP = 'https://script.google.com/macros/s/AKfycbzmSCEzmWVFiQFFnC2srZ9Che7S4lu6Z1-LTekJ2E1svfk5Oz0gyzvToOM-0nMMs3x01A/exec';
  var path = location.pathname.replace(/^\/+|\/+$/g, '');
  var m = path.match(/^sign\/([A-Za-z0-9-]{12,64})$/i);
  var url = APP;
  if (m) {
    url = APP + '?sign=' + encodeURIComponent(m[1]);
    document.title = 'ลงนามสัญญาออนไลน์ | STROM';
    document.getElementById('msg').textContent = 'กำลังเปิดหน้าลงนามสัญญา…';
    document.getElementById('go').textContent = 'เปิดหน้าลงนามสัญญา';
  } else if (path) { location.replace('/'); }
  document.getElementById('go').href = url;
  document.getElementById('fbl').href = url;
  var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (mobile) {
    var f = document.getElementById('app'), loaded = false;
    f.onload = function () { loaded = true; f.style.display = 'block'; document.getElementById('box').style.display = 'none'; };
    f.src = url;
    setTimeout(function () { if (!loaded) document.getElementById('fb').style.display = 'block'; }, 15000);
  } else {
    location.replace(url);
  }
</script>
</body>
</html>
